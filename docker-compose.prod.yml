# Gaeclip — DISTRIBUTION compose (no build required).
#
# Uses the prebuilt MONO image from GHCR (published by
# .github/workflows/docker.yml): API + worker + frontend in one container.
# For local development with live builds, use docker-compose.yml instead.
#
# Quick start:
#   cp .env.example .env        # fill in GEMINI_API_KEY (or set it in the UI later)
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#   # UI: http://127.0.0.1:3000
#
# Pin a release instead of latest:
#   GAECLIP_VERSION=1.2.3 docker compose -f docker-compose.prod.yml pull
#   GAECLIP_VERSION=1.2.3 docker compose -f docker-compose.prod.yml up -d

services:
  app:
    image: ghcr.io/${GHCR_OWNER:-rahmadwidiansyah}/gaeclip:${GAECLIP_VERSION:-latest}
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:3000:3000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-30}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      STORAGE_ROOT: ${STORAGE_ROOT:-/app/storage}
      MIN_CLIP_DURATION_SECONDS: ${MIN_CLIP_DURATION_SECONDS:-30}
      MAX_CLIP_DURATION_SECONDS: ${MAX_CLIP_DURATION_SECONDS:-60}
      CLIP_BUFFER_SECONDS: ${CLIP_BUFFER_SECONDS:-1.5}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      FRONTEND_PORT: 3000
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      YTDLP_COOKIES_FILE: ${YTDLP_COOKIES_FILE:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      MAX_TRANSCRIPT_CHARS: ${MAX_TRANSCRIPT_CHARS:-1000000}
      MAX_LLM_INPUT_CHARS: ${MAX_LLM_INPUT_CHARS:-120000}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
