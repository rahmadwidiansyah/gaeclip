# Gaeclip dev compose: builds the MONO image (API + worker + frontend)
# from source. For prebuilt GHCR images, use docker-compose.prod.yml.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the frontend at build time (NEXT_PUBLIC_* are inlined
        # by Next.js). Rebuild after changing this value. Points at the
        # dedicated api subdomain (no path-routing involved).
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api-gaeclip.sanding.online}
    ports:
      # Host ports: 4113 = frontend UI, 4114 = backend API.
      # 0.0.0.0 = reachable from LAN/other devices (and Cloudflare Tunnel).
      # Internal container ports stay 3000/8000 (FRONTEND_PORT/API_PORT).
      - "0.0.0.0:4113:3000"
      - "0.0.0.0:4114:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-30}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      STORAGE_ROOT: ${STORAGE_ROOT:-/app/storage}
      MIN_CLIP_DURATION_SECONDS: ${MIN_CLIP_DURATION_SECONDS:-30}
      MAX_CLIP_DURATION_SECONDS: ${MAX_CLIP_DURATION_SECONDS:-60}
      CLIP_BUFFER_SECONDS: ${CLIP_BUFFER_SECONDS:-1.5}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      # Public/LAN binding needs a bearer token. For Cloudflare Tunnel set
      # PUBLIC_MODE=true and a long random API_AUTH_TOKEN in .env, then enter
      # the same token under Settings -> Koneksi API.
      PUBLIC_MODE: ${PUBLIC_MODE:-false}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
      FRONTEND_PORT: 3000
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://127.0.0.1:4113,http://localhost:4113,http://192.168.1.85:4113,https://gaeclip.sanding.online}
      SOCIAL_PUBLIC_MEDIA_BASE_URL: ${SOCIAL_PUBLIC_MEDIA_BASE_URL:-}
      YTDLP_COOKIES_FILE: ${YTDLP_COOKIES_FILE:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      MAX_TRANSCRIPT_CHARS: ${MAX_TRANSCRIPT_CHARS:-1000000}
      MAX_LLM_INPUT_CHARS: ${MAX_LLM_INPUT_CHARS:-120000}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped

  # Cloudflare Tunnel (optional, off by default). Enable with:
  #   1. cp cloudflared/config.yml.example cloudflared/config.yml
  #   2. fill TUNNEL_ID + place the credentials JSON as
  #      cloudflared/tunnel.json (from `cloudflared tunnel create`)
  #   3. docker compose --profile tunnel up -d
  # Ingress inside config.yml routes:
  #   gaeclip.sanding.online/api/* + /health/* -> app:8000
  #   gaeclip.sanding.online/*                -> app:3000
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      app:
        condition: service_started
    profiles: ["tunnel"]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
