name: windows-desktop

# Validates the DESKTOP edition on real Windows. Linux CI (if any) covers
# the test suite; this workflow additionally proves the installer builds
# and the desktop runtime boots without Docker/Redis/Celery.
on:
  push:
    paths:
      - "src/gaeclip/**"
      - "src-tauri/**"
      - "frontend/**"
      - "desktop/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python deps (API set, CPU torch)
        run: |
          python -m pip install -e ".[api,llm,transcription,framing]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pyinstaller

      - name: Backend regression (server default)
        run: python -m pytest tests/ -q --ignore=tests/test_vision_benchmark.py

      - name: Desktop runtime tests
        run: |
          $env:GAECLIP_RUNTIME = "desktop"
          python -m pytest tests/test_runtime.py -q

      - name: Build backend exe (PyInstaller, onedir)
        run: |
          pyinstaller --noconfirm --onedir --name gaeclip-api `
            --collect-all gaeclip `
            -p src src/gaeclip/desktop.py
          New-Item -ItemType Directory -Force -Path binaries | Out-Null
          Copy-Item dist/gaeclip-api/gaeclip-api.exe binaries/

      - name: Fetch third-party binaries
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $ffmpeg = "$env:RUNNER_TEMP/ffmpeg.zip"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $ffmpeg
          Expand-Archive $ffmpeg -DestinationPath "$env:RUNNER_TEMP/ff"
          Copy-Item "$env:RUNNER_TEMP/ff/*/bin/ffmpeg.exe" bin/
          $deno = "$env:RUNNER_TEMP/deno.zip"
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/download/v2.5.4/deno-x86_64-pc-windows-msvc.zip" -OutFile $deno
          Expand-Archive $deno -DestinationPath bin/
          Copy-Item (Join-Path (Split-Path (Get-Command node).Source) "node.exe") bin/

      - name: Build frontend + Tauri installer
        run: |
          npm --prefix frontend install
          npm --prefix frontend run build
          npx --yes @tauri-apps/cli build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Smoke test (desktop runtime, no Docker/Redis)
        run: |
          $env:GAECLIP_RUNTIME = "desktop"
          $env:STORAGE_ROOT = "$env:RUNNER_TEMP/gaeclip-storage"
          Start-Job { python -m gaeclip.desktop } | Out-Null
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $cfg = Invoke-RestMethod http://127.0.0.1:8000/health/config
              if ($cfg.runtime -eq "desktop") { $ok = $true; break }
            } catch { Start-Sleep 2 }
          }
          if (-not $ok) { throw "desktop API did not report runtime=desktop" }

      - uses: actions/upload-artifact@v4
        with:
          name: gaeclip-setup
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.zip
            src-tauri/target/release/bundle/nsis/*.zip.sig
