name: windows-desktop

# Validates the DESKTOP edition on real Windows. Linux CI (if any) covers
# the test suite; this workflow additionally proves the installer builds
# and the desktop runtime boots without Docker/Redis/Celery.
on:
  push:
    paths:
      - "src/gaeclip/**"
      - "src-tauri/**"
      - "frontend/**"
      - "desktop/**"
      - "tests/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

concurrency:
  # A new push supersedes the previous run on the same ref: no queue
  # pile-up when iterating fast.
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-windows.lock

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Pin the compiler: a floating stable can break the Tauri build
          # without any source change. Bump together with Cargo.lock.
          toolchain: 1.99.0

      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-provider: github

      - name: Install Python deps (locked, CPU torch)
        run: |
          # requirements-windows.lock is the exact package set from the
          # last green Windows run. Keep it in sync with pyproject.toml.
          python -m pip install -r requirements-windows.lock `
            --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . --no-deps --no-build-isolation

      - name: Backend regression (server default)
        run: python -m pytest tests/ -q --ignore=tests/test_vision_benchmark.py

      - name: Desktop runtime tests
        run: |
          $env:GAECLIP_RUNTIME = "desktop"
          python -m pytest tests/test_runtime.py -q

      - name: Build backend exe (PyInstaller, onedir)
        run: |
          # NOTE: size is not a concern — correctness first. Everything the
          # pipeline can touch rides along, including dynamic imports that
          # PyInstaller's static analysis cannot see (__import__(name)):
          # mediapipe/ultralytics (via vision_adapters._require), the full
          # Whisper stack, and cv2 data files.
          pyinstaller --noconfirm --onedir --name gaeclip-api `
            --collect-all gaeclip `
            --collect-all mediapipe `
            --collect-all ultralytics `
            --collect-all cv2 `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all onnxruntime `
            --collect-all tokenizers `
            -p src src/gaeclip/desktop.py
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          # Tauri externalBin paths resolve under src-tauri/, and the file
          # must carry the target-triple suffix (used at build AND runtime
          # by sidecar("gaeclip-api")) — plain gaeclip-api.exe is not found.
          Copy-Item dist/gaeclip-api/gaeclip-api.exe `
            src-tauri/binaries/gaeclip-api-x86_64-pc-windows-msvc.exe
          # PyInstaller onedir keeps all DLLs/python in _internal/ next to
          # the exe — externalBin only bundles the exe, so stage _internal
          # for bundle.resources (lands beside the installed sidecar exe,
          # where the bootloader looks for python DLLs).
          Copy-Item -Recurse dist/gaeclip-api/_internal `
            src-tauri/binaries/_internal

      - name: Smoke test bundled backend exe (PyInstaller)
        run: |
          # The source-runtime smoke test below proves gaeclip.desktop
          # works. It does NOT prove the frozen bundle works: hidden
          # imports and missing DLLs only fail in dist/. Boot the real
          # onedir exe, hit health/config, then touch a social route so
          # the new gaeclip.social package is proven importable.
          $ErrorActionPreference = "Stop"
          Remove-Item Env:API_AUTH_TOKEN -ErrorAction SilentlyContinue
          $env:GAECLIP_RUNTIME = "desktop"
          $env:API_HOST = "127.0.0.1"
          $env:API_PORT = "8010"
          $env:STORAGE_ROOT = "$env:RUNNER_TEMP/gaeclip-exe-storage"
          $exe = (Resolve-Path "dist/gaeclip-api/gaeclip-api.exe").Path
          $proc = Start-Process -FilePath $exe -PassThru -NoNewWindow `
            -WorkingDirectory (Split-Path $exe)
          try {
            $ok = $false
            for ($i = 0; $i -lt 45; $i++) {
              Start-Sleep 2
              try {
                $cfg = Invoke-RestMethod http://127.0.0.1:8010/health/config
                if ($cfg.runtime -eq "desktop") { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw "bundled backend did not report runtime=desktop" }
            $accounts = Invoke-RestMethod http://127.0.0.1:8010/api/v1/social/accounts
            if ($null -eq $accounts.accounts) { throw "social API missing from bundle" }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Fetch third-party binaries
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $ffmpeg = "$env:RUNNER_TEMP/ffmpeg.zip"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $ffmpeg
          Expand-Archive $ffmpeg -DestinationPath "$env:RUNNER_TEMP/ff"
          Copy-Item "$env:RUNNER_TEMP/ff/*/bin/ffmpeg.exe" bin/
          Copy-Item "$env:RUNNER_TEMP/ff/*/bin/ffprobe.exe" bin/
          $deno = "$env:RUNNER_TEMP/deno.zip"
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/download/v2.5.4/deno-x86_64-pc-windows-msvc.zip" -OutFile $deno
          Expand-Archive $deno -DestinationPath bin/
          Copy-Item (Join-Path (Split-Path (Get-Command node).Source) "node.exe") bin/
          # yt-dlp: use the OFFICIAL standalone exe (PyInstaller bundle,
          # ~30MB, embeds Python). The pip console script is only a ~100KB
          # launcher stub pointing at the runner's Python + Scripts dir, so
          # it dies silently (exit 1, no output) on user machines.
          # latest = feature here: yt-dlp must track YouTube changes.
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile bin/yt-dlp.exe

      - name: Smoke test staged tools (fail fast on stub/broken exes)
        run: |
          $ErrorActionPreference = "Stop"
          bin/yt-dlp.exe --version
          bin/ffmpeg.exe -version | Select-Object -First 1
          bin/ffprobe.exe -version | Select-Object -First 1
          bin/deno.exe --version
          bin/node.exe --version

      - name: Build frontend + Tauri installer
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location frontend
          npm ci
          npm run build
          Pop-Location
          # Local, pinned devDependency — never npx --yes (floating CLI).
          # Run from the repo root so the CLI finds src-tauri/.
          & "frontend/node_modules/.bin/tauri.cmd" build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Smoke test (desktop runtime, no Docker/Redis)
        run: |
          $env:GAECLIP_RUNTIME = "desktop"
          $env:STORAGE_ROOT = "$env:RUNNER_TEMP/gaeclip-storage"
          Start-Job { python -m gaeclip.desktop } | Out-Null
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $cfg = Invoke-RestMethod http://127.0.0.1:8000/health/config
              if ($cfg.runtime -eq "desktop") { $ok = $true; break }
            } catch { Start-Sleep 2 }
          }
          if (-not $ok) { throw "desktop API did not report runtime=desktop" }

      - uses: actions/upload-artifact@v4
        with:
          name: gaeclip-setup
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.zip
            src-tauri/target/release/bundle/nsis/*.zip.sig
