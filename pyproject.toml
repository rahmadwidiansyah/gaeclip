[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gaeclip"
version = "0.2.1"
description = "Local YouTube auto-shorts generator"
requires-python = ">=3.11,<3.15"
dependencies = [
  "pydantic>=2.8,<3",
  "yt-dlp>=2025.1,<2027",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
llm = ["google-genai>=1,<2"]
transcription = ["faster-whisper>=1,<2", "av>=12.3"]
vision = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "ultralytics>=8.3,<9",
  "mediapipe>=0.10.14,<0.11",
]
framing = [
  "mediapipe>=0.10.14,<0.11",
]
api = [
  "fastapi>=0.115,<1",
  "redis>=5,<7",
  "celery>=5.4,<6",
  "uvicorn[standard]>=0.30,<1",
  "cryptography>=41,<400",
  "python-multipart>=0.0.20,<1",
]

[project.scripts]
gaeclip = "gaeclip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
